<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'IBM Plex Mono', monospace;
  background: #FBF3E6;
  color: #201a17;
  overflow: hidden;
}
.brand {
  position: absolute;
  top: 6vh;
  left: 50%;
  transform: translateX(-50%);

  font-style: italic;
  font-weight: 900;

}

  margin-top: 8px;
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  opacity: 0.5;
}
.hub {
  display: flex;
  height: 100vh;
  width: 100%;
}
.hub-half {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #201a17;
  position: relative;
  transition: background 0.25s ease, color 0.25s ease;
}
.hub-half:first-child { border-right: 1px solid rgba(32,26,23,0.15); }
.hub-half:hover { background: #201a17; color: #FBF3E6; }

  z-index: 1;

  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  opacity: 0.55;
  margin-bottom: 16px;
}
.hub-half .name {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(24px, 4.4vw, 40px);
  line-height: 1.2;
}
.hub-half.lab .name { color: #EC2B7A; }
.hub-half.lab:hover .name { color: #CEFF32; }
.hub-half .icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 130px;
  opacity: 0.08;
  z-index: 0;
  pointer-events: none;
}
.hub-half .arrow {
  display: block;
  margin-top: 18px;
  font-size: 13px;
  letter-spacing: 0.1em;
  opacity: 0.5;
}

@media (max-width: 680px) {
  .hub { flex-direction: column; }
  .hub-half:first-child { border-right: none; border-bottom: 1px solid rgba(32,26,23,0.15); }
  .hub-half.sexys { background: #FDEAF2; }
  .hub-half.lab { background: #F4FBD9; }

</head>

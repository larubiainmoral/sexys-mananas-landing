<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {

/* ── PANTALLA 2: mensaje ── */

  flex-direction: column;

  align-items: center;

</style>

<body>

var lastIndex = {};

function render(mood) {
  var pool = mood.msgs;
  var idx;
  do { idx = Math.floor(Math.random() * pool.length); }
  while (pool.length > 1 && idx === lastIndex[mood.key]);
  lastIndex[mood.key] = idx;

  document.getElementById('message-tag').textContent = mood.tag;
  var card = document.getElementById('message-card');
  card.style.opacity = '0';
  setTimeout(function () {
    card.innerHTML = pool[idx] + '<span class="signature">— larubiainmoral</span>';
    card.style.opacity = '1';
  }, 200);
}

var PASSWORD = "LAMAGIAEXISTE";
var STORAGE_KEY = "lsm-mensajes-acceso";

function unlock() {
  document.getElementById('gate-screen').style.display = 'none';
  document.getElementById('pick-screen').style.display = 'block';
}

if (localStorage.getItem(STORAGE_KEY) === "ok") {
  unlock();
} else {
  var gateInput = document.getElementById('gate-input');
  var gateError = document.getElementById('gate-error');

  function tryUnlock() {
    var value = gateInput.value.trim().toUpperCase();
    if (value === PASSWORD) {
      localStorage.setItem(STORAGE_KEY, "ok");
      gateError.style.display = 'none';
      unlock();
    } else {
      gateError.style.display = 'block';
    }
  }

  document.getElementById('gate-btn').onclick = tryUnlock;
  gateInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tryUnlock();
  });
}

var currentMood = null;

var grid = document.getElementById('moods-grid');
MOODS.forEach(function (mood) {
  var btn = document.createElement('button');
  btn.className = 'mood-btn';
  btn.textContent = mood.label;
  btn.onclick = function () {
    currentMood = mood;
    document.getElementById('pick-screen').style.display = 'none';
    document.getElementById('message-screen').style.display = 'block';
    render(mood);
  };
  grid.appendChild(btn);
});

document.getElementById('otro-btn').onclick = function () {
  if (currentMood) render(currentMood);
};

document.getElementById('volver-btn').onclick = function () {
  document.getElementById('message-screen').style.display = 'none';
  document.getElementById('pick-screen').style.display = 'block';
};
